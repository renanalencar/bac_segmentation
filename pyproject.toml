[project]
name = "bac-segmentation"
version = "0.1.0"
description = "Artificial intelligence-based quantification of breast arterial calcifications to predict cardiovascular morbidity and mortality"
authors = [
    {name = "Renan Costa Alencar", email = "renan.costaalencar@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pydicom>=3.0.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "albumentations>=1.4.0",
    "boto3>=1.35.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.5.0",
    "tensorboard>=2.18.0",
    "sphinx>=9.1.0",
    "coverage>=7.16.1",
    "flake8>=7.4.1",
    "annotated-types>=0.8.0",
    "attrs>=26.1.0",
    "bleach>=6.4.0",
    "certifi>=2026.7.22",
    "charset-normalizer>=3.5.1",
    "cmap>=0.7.2",
    "contourpy>=1.4.0",
    "cycler>=0.12.1",
    "fastjsonschema>=2.22.2",
    "filelock>=4.0.4",
    "flatbuffers>=25.12.19",
    "fonttools>=4.66.0",
    "gdown>=6.4.0",
    "idna>=3.20",
    "imageio>=2.37.4",
    "imgviz>=2.1.0",
    "jsonschema>=4.26.0",
    "jsonschema-specifications>=2025.9.1",
    "jupyter-core>=5.9.1",
    "jupytext>=1.19.5",
    "kaggle>=2.2.4",
    "kagglesdk>=0.1.37",
    "kiwisolver>=1.5.1",
    "labelme>=7.7.0",
    "lazy-loader>=0.6",
    "loguru>=0.7.3",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "mdurl>=0.1.2",
    "natsort>=8.4.0",
    "nbformat>=5.11.1",
    "networkx>=3.7",
    "onnxruntime>=1.28.0",
    "osam>=0.8.1",
    "packaging>=26.3",
    "platformdirs>=4.12.0",
    "protobuf>=7.36.2",
    "pydantic>=2.13.5",
    "pyparsing>=3.3.3",
    "pyqt5>=5.15.11",
    "pyqt5-qt5>=5.15.19",
    "pyqt5-sip>=12.19.0",
    "pysocks>=1.7.1",
    "python-dateutil>=2.9.0.post0",
    "python-slugify>=9.1.1",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
    "requests>=2.34.2",
    "rpds-py>=2026.6.3",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "six>=1.17.0",
    "soupsieve>=2.10",
    "text-unidecode>=1.3",
    "traitlets>=5.16.1",
    "typing-extensions>=4.16.0",
    "typing-inspection>=0.4.4",
    "urllib3>=2.8.0",
    "webencodings>=0.6.1",
    "embed-toolkit>=0.2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "ruff>=0.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
