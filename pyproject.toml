[project]
name = "bac-segmentation"
version = "0.1.0"
description = "Artificial intelligence-based quantification of breast arterial calcifications to predict cardiovascular morbidity and mortality"
authors = [
    {name = "Renan Costa Alencar", email = "renan.costaalencar@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

dependencies = [
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pydicom>=3.0.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "albumentations>=1.4.0",
    "boto3>=1.35.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.5.0",
    "tensorboard>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "ruff>=0.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"